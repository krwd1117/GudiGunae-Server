name: Deploy NestJS to M1 Mac mini

on:
  push:
    branches:
      - develop

env:
  PROJECT_DIR: /Users/krwd/Develop/GudiGunae-Server

jobs:
  deploy:
    runs-on: self-hosted
    environment: SLACK_WEBHOOK_URL

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 서버 코드 pull
        run: |
          cd ${{ env.PROJECT_DIR }}
          git pull origin develop

      - name: 패키지 설치
        run: 
          cd ${{ env.PROJECT_DIR }}
          npm ci

      - name: NestJS 빌드
        run: 
          cd ${{ env.PROJECT_DIR }}
          npm run build

      - name: PM2 서비스 재시작
        run: |
          pm2 restart gudigunae-server
          pm2 save

      - name: Slack 알림 전송 (성공)
        if: success()
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data '{"text":"✅ NestJS 서버 배포 성공 (재시작 완료) on M1 맥 미니 🎉"}' \
          ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Slack 알림 전송 (실패)
        if: failure()
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data '{"text":"❌ NestJS 서버 배포 실패... PM2 재시작 확인 필요 🔥"}' \
          ${{ secrets.SLACK_WEBHOOK_URL }}
