name: Deploy NestJS on Merge

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 종속성 설치 (캐싱 포함)
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: npm 패키지 설치
        run: npm install

      - name: 빌드 실행
        run: |
          npm run build || (echo "[빌드 실패] 이전 버전 유지" && exit 1)

      - name: PM2로 서비스 재시작
        run: |
          pm2 delete gudigunae-server || true
          pm2 start dist/main.js --name "gudigunae-server"
