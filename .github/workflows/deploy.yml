name: Deploy NestJS to M1 Mac mini

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 패키지 설치
        run: npm ci

      - name: NestJS 빌드
        run: npm run build

      - name: 서비스 재시작 (PM2)
        run: |
          pm2 delete gudigunae-server || true
